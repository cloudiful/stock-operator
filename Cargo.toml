[package]
name = "stock-operator"
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
description = "macOS desktop operator for supervised brokerage workflows"
readme = "README.md"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "macos")'.dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
axuielement = "0.9.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
keyring = "3.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "=3.1.1", default-features = false, features = ["macros", "schemars", "server", "transport-streamable-http-server"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
schemars = { version = "1.2.2", features = ["chrono04"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
thiserror = "2.0.11"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "time", "fs", "io-util", "sync", "process"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5"
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono", "uuid"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
tempfile = "3.10.1"
tower = "0.5.3"
