[package]
name = "stock-operator"
version = "0.2.12"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/cloudiful/stock-goes-stonk"
description = "macOS-only local UI operator for supervised broker operations (standalone extract)"
readme = "README.md"
build = "build.rs"

[target.'cfg(target_os = "macos")'.dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
axuielement = "0.9.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
rmcp = { version = "=3.1.1", default-features = false, features = ["macros", "schemars", "server", "transport-streamable-http-server"] }
schemars = { version = "1.2.2", features = ["chrono04"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "time", "fs", "io-util", "sync", "process"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono", "uuid"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
tower = "0.5.3"
