[package]
name = "stock-operator"
version = "1.0.5"
edition = "2024"
license = "Apache-2.0"
description = "macOS desktop operator for supervised brokerage workflows"
readme = "README.md"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
keyring = "4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "3.3.0", default-features = false, features = ["macros", "schemars", "server", "transport-streamable-http-server"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
schemars = { version = "1.2.2", features = ["chrono04"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-single-instance = "2.4.4"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "time", "fs", "io-util", "sync", "process"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
url = "2.5.8"
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono", "uuid"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
tower = "0.5.3"
