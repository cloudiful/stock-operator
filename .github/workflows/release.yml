name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TERM_COLOR: always
      SQLX_OFFLINE: "true"
      MACOSX_DEPLOYMENT_TARGET: "26.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable with target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: v0.17.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build frontend
        run: |
          set -euo pipefail
          bun install --cwd ui
          bun run --cwd ui build
          test -f ui/dist/index.html
          test -f ui/dist/theme-bootstrap.js
          ls -lh ui/dist/

      - name: Build and package .app
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RUSTC_WRAPPER: sccache
          SCCACHE_BASEDIRS: ${{ github.workspace }}
          SCCACHE_BUCKET: sccache
          SCCACHE_ENDPOINT: https://12412d5b061683494ea3e5c217d6a961.r2.cloudflarestorage.com
          SCCACHE_REGION: auto
        run: |
          set -euo pipefail
          echo "target=${{ matrix.target }} arch=${{ matrix.arch }} ref=${{ github.ref_name }}"
          sh package.sh --target ${{ matrix.target }} --output "target/stock-operator-${{ matrix.target }}/Stock Operator.app"
          ls -R "target/stock-operator-${{ matrix.target }}/Stock Operator.app"
          test -f "target/stock-operator-${{ matrix.target }}/Stock Operator.app/Contents/MacOS/stock-operator"
          test -f "target/stock-operator-${{ matrix.target }}/Stock Operator.app/Contents/Helpers/window-ocr"
          test -f "target/stock-operator-${{ matrix.target }}/Stock Operator.app/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "target/stock-operator-${{ matrix.target }}/Stock Operator.app" || true
          plutil -lint "target/stock-operator-${{ matrix.target }}/Stock Operator.app/Contents/Info.plist"

      - name: Show sccache stats
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RUSTC_WRAPPER: sccache
          SCCACHE_BASEDIRS: ${{ github.workspace }}
          SCCACHE_BUCKET: sccache
          SCCACHE_ENDPOINT: https://12412d5b061683494ea3e5c217d6a961.r2.cloudflarestorage.com
          SCCACHE_REGION: auto
        run: sccache --show-stats

      - name: Create DMG from .app
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}"
          TARGET="${{ matrix.target }}"
          APP_DIR="target/stock-operator-${TARGET}"
          DMG_NAME="stock-operator-${VERSION}-${TARGET}.dmg"
          STAGE_DIR="$(mktemp -d)"
          MOUNT_DIR="$(mktemp -d)"
          cleanup() {
            hdiutil detach "${MOUNT_DIR}" 2>/dev/null || true
            rm -rf "${STAGE_DIR}" "${MOUNT_DIR}" 2>/dev/null || true
          }
          trap cleanup EXIT
          ditto "${APP_DIR}/Stock Operator.app" "${STAGE_DIR}/Stock Operator.app"
          hdiutil create -volname "Stock Operator" -srcfolder "${STAGE_DIR}" -ov -format UDZO "${DMG_NAME}"
          ls -lh "${DMG_NAME}"
          hdiutil verify "${DMG_NAME}"
          hdiutil imageinfo "${DMG_NAME}" | head -n 100
          hdiutil attach "${DMG_NAME}" -mountpoint "${MOUNT_DIR}" -nobrowse -readonly
          ls -R "${MOUNT_DIR}"
          test -f "${MOUNT_DIR}/Stock Operator.app/Contents/MacOS/stock-operator"
          test -f "${MOUNT_DIR}/Stock Operator.app/Contents/Helpers/window-ocr"
          test -f "${MOUNT_DIR}/Stock Operator.app/Contents/Info.plist"
          hdiutil detach "${MOUNT_DIR}"
          trap - EXIT
          rm -rf "${STAGE_DIR}" "${MOUNT_DIR}"
          shasum -a 256 "${DMG_NAME}" | tee "${DMG_NAME}.sha256"
          shasum -a 256 "${DMG_NAME}" > "SHA256SUMS-${TARGET}.txt"
          cat "SHA256SUMS-${TARGET}.txt"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.target }}
          path: |
            stock-operator-*.dmg
            stock-operator-*.dmg.sha256
            SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish GitHub Release
    needs: build-macos
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all DMGs
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare release assets
        run: |
          set -euo pipefail
          ls -R dist
          mkdir -p release
          find dist -name "*.dmg" -exec cp {} release/ \;
          find dist -name "*.sha256" -exec cp {} release/ \;
          ls -lh release
          (cd release && shasum -a 256 *.dmg > SHA256SUMS)
          cat release/SHA256SUMS
          (cd release && shasum -a 256 -c SHA256SUMS)
          for f in release/*.dmg; do
            size=$(wc -c < "$f")
            echo "$f size=$size"
            if [ "$size" -lt 1048576 ]; then echo "DMG too small: $f"; exit 1; fi
          done

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
