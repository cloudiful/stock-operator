name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TERM_COLOR: always
      SQLX_OFFLINE: "true"
      MACOSX_DEPLOYMENT_TARGET: "26.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable with target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: v0.17.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build frontend
        run: |
          set -euo pipefail
          bun install --cwd ui
          bun run --cwd ui build
          test -f ui/dist/index.html
          test -f ui/dist/theme-bootstrap.js
          ls -lh ui/dist/

      - name: Setup Nushell
        uses: hustcer/setup-nu@9215c80adb545a85c419d5085b76eb6d082f49e7 # v3
        with:
          version: "0.115.1"

      - name: Build and package .app
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RUSTC_WRAPPER: sccache
          SCCACHE_BASEDIRS: ${{ github.workspace }}
          SCCACHE_BUCKET: sccache
          SCCACHE_ENDPOINT: https://12412d5b061683494ea3e5c217d6a961.r2.cloudflarestorage.com
          SCCACHE_REGION: auto
        run: |
          set -euo pipefail
          echo "target=${{ matrix.target }} arch=${{ matrix.arch }} ref=${{ github.ref_name }}"
          nu package.nu --target ${{ matrix.target }} --output "target/stock-operator-${{ matrix.target }}/Stock Operator.app"
          ls -R "target/stock-operator-${{ matrix.target }}/Stock Operator.app"
          test -f "target/stock-operator-${{ matrix.target }}/Stock Operator.app/Contents/MacOS/stock-operator"
          test -f "target/stock-operator-${{ matrix.target }}/Stock Operator.app/Contents/Helpers/window-ocr"
          test -f "target/stock-operator-${{ matrix.target }}/Stock Operator.app/Contents/Info.plist"
          codesign --verify --deep --strict --verbose=2 "target/stock-operator-${{ matrix.target }}/Stock Operator.app" || true
          plutil -lint "target/stock-operator-${{ matrix.target }}/Stock Operator.app/Contents/Info.plist"

      - name: Show sccache stats
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RUSTC_WRAPPER: sccache
          SCCACHE_BASEDIRS: ${{ github.workspace }}
          SCCACHE_BUCKET: sccache
          SCCACHE_ENDPOINT: https://12412d5b061683494ea3e5c217d6a961.r2.cloudflarestorage.com
          SCCACHE_REGION: auto
        run: sccache --show-stats

      - name: Create clickable .app archive
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}"
          TARGET="${{ matrix.target }}"
          APP_DIR="target/stock-operator-${TARGET}"
          ZIP_NAME="stock-operator-${VERSION}-${TARGET}.app.zip"
          # ditto preserves macOS bundle metadata better than zip
          ditto -c -k --keepParent "${APP_DIR}/Stock Operator.app" "${ZIP_NAME}"
          # alternative fallback: zip -r "${ZIP_NAME}" "${APP_DIR}/Stock Operator.app"
          ls -lh "${ZIP_NAME}"
          shasum -a 256 "${ZIP_NAME}" | tee "${ZIP_NAME}.sha256"
          # Also produce individual SHA file for upload
          shasum -a 256 "${ZIP_NAME}" > "SHA256SUMS-${TARGET}.txt"
          cat "SHA256SUMS-${TARGET}.txt"

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.target }}
          path: |
            stock-operator-*.app.zip
            stock-operator-*.app.zip.sha256
            SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish GitHub Release
    needs: build-macos
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all archives
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare release assets
        run: |
          set -euo pipefail
          ls -R dist
          mkdir -p release
          find dist -name "*.app.zip" -exec cp {} release/ \;
          find dist -name "*.sha256" -exec cp {} release/ \;
          ls -lh release
          # Generate combined SHA256SUMS
          (cd release && shasum -a 256 *.app.zip > SHA256SUMS)
          cat release/SHA256SUMS
          # Verify each zip is at least 1MB (bundle not empty)
          for f in release/*.app.zip; do
            size=$(wc -c < "$f")
            echo "$f size=$size"
            if [ "$size" -lt 1048576 ]; then echo "archive too small: $f"; exit 1; fi
          done

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
