name: CI (Forgejo)

# Forgejo intranet CI — Linux `aio` has no macOS toolchain. Full Rust compile/test
# is validated on GitHub Actions `macos-15` (see .github/workflows/ci.yml) where the
# macOS cfg crate compiles and 97+ tests execute. Forgejo on Linux would compile only
# the 6-line non-macOS stub with 0 tests, so it must not claim full Rust validation.
# This workflow is therefore limited to formatting, static asset, and documentation
# checks, with an explicit note about the macOS runner requirement.
# If a self-hosted macOS runner is added, extend this workflow with a macOS job using
# labels `macos-15` / `macos-13` and restore `cargo check --all-targets` / `cargo test --all-targets`.

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check (fmt, static assets, docs) — Linux aio
    runs-on: aio
    env:
      CARGO_TERM_COLOR: always
      SQLX_OFFLINE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Validate Tauri config and static assets (Linux static-only)
        run: |
          set -euo pipefail
          echo "validating tauri.conf.json..."
          python3 -m json.tool tauri.conf.json > /dev/null
          echo "validating capabilities/default.json..."
          python3 -m json.tool capabilities/default.json > /dev/null
          test -f ui/index.html
          test -f ui/main.js
          test -f ui/styles.css
          test -f icons/icon.png
          test -f icons/icon.icns
          test -f macos/Info.plist.template
          test -f migrations/0001_initial.sql
          test -f migrations/0002_stale_resolve.sql
          test -f package.nu
          grep -q "com.cloudiful.stock-operator" tauri.conf.json
          grep -q "Stock Operator" tauri.conf.json
          grep -q "ipc:" tauri.conf.json || (echo "CSP must include ipc: for Tauri invoke"; exit 1)
          if grep -q "LSUIElement" macos/Info.plist.template; then echo "LSUIElement must be removed for windowed app"; exit 1; fi
          grep -q "CFBundleIconFile" macos/Info.plist.template
          echo "Tauri static assets validated on Forgejo Linux runner (static-only)"

      - name: Validate documentation and protocol paths
        run: |
          set -euo pipefail
          grep -q "src/storage" docs/protocol.md || (echo "docs/protocol.md should reference src/storage module tree"; exit 1)
          test -f README.md
          grep -q "macos-15" .github/workflows/ci.yml
          grep -q "stale_resolved" migrations/0002_stale_resolve.sql
          echo "docs validated"

      - name: Check git diff does not contain whitespace errors
        run: git diff --check || echo "diff check warnings above (non-fatal)"

      - name: Note on macOS Rust validation
        run: |
          echo "Forgejo CI on Linux aio is static-only: formatting, assets, docs."
          echo "Full Rust crate (macOS cfg) compiles and 97+ tests run on GitHub Actions macos-15."
          echo "Linux cargo check/test would compile only the non-macOS stub with 0 tests and is intentionally not run here."
          echo "To enable full Rust validation on Forgejo, provision a self-hosted macOS runner with Swift/Xcode and add a job with runs-on: macos-15 (arm64) and macos-13 (x86_64), then invoke 'cargo check/test --all-targets'."
