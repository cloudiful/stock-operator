name: CI (Forgejo)

# Forgejo intranet CI — test-focused on Linux because no macOS runner is currently
# provisioned on the intranet. macOS arm64/x86_64 packaging and .app bundling are
# validated and released via GitHub Actions (macos-15 for aarch64 M4, macos-13 for x86_64).
# If a self-hosted macOS runner is added, extend this workflow with a macOS job using
# labels `macos-15` / `macos-13` or the intranet's macOS queue name and document it here.
# Thin shared-action wrappers (e.g. build-rust-artifacts) do not fit this Tauri + Swift
# OCR helper project, so steps use direct toolchain actions.

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check (fmt, test, tauri assets) — Linux
    runs-on: aio
    env:
      CARGO_TERM_COLOR: always
      SQLX_OFFLINE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Cargo check
        run: SQLX_OFFLINE=true cargo check --all-targets

      - name: Cargo test
        run: SQLX_OFFLINE=true cargo test --all-targets

      - name: Validate Tauri config and static assets
        run: |
          set -euo pipefail
          echo "validating tauri.conf.json..."
          python3 -m json.tool tauri.conf.json > /dev/null
          echo "validating capabilities/default.json..."
          python3 -m json.tool capabilities/default.json > /dev/null
          test -f ui/index.html
          test -f ui/main.js
          test -f ui/styles.css
          test -f icons/icon.png
          test -f icons/icon.icns
          test -f macos/Info.plist.template
          test -f migrations/0001_initial.sql
          test -f package.nu
          grep -q "com.cloudiful.stock-operator" tauri.conf.json
          grep -q "Stock Operator" tauri.conf.json
          echo "Tauri assets validated on Forgejo Linux runner"

      - name: Check git diff does not contain whitespace errors
        run: git diff --check || echo "diff check warnings above (non-fatal)"

      - name: Note on macOS packaging
        run: |
          echo "Forgejo CI is test-focused (Linux aio). macOS .app packaging with OCR helper requires macOS runners (Xcode + Swift + Tauri) and is performed on GitHub Actions."
          echo "To enable macOS builds on Forgejo, provision a self-hosted macOS runner with Swift/Xcode and add a job with runs-on: macos-15 (arm64) and macos-13 (x86_64), then invoke 'nu package.nu --target aarch64-apple-darwin/x86_64-apple-darwin'."
